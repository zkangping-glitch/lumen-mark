name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Test native path boundaries
        shell: powershell
        run: ./tools/test-host.ps1
      - name: Build Windows installer
        shell: pwsh
        run: ./build-installer.ps1 -SkipBuild
      - name: Test install, upgrade, associations and uninstall
        shell: powershell
        run: ./tools/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LumenMark-Setup-x64
          path: output/LumenMark-Setup-*-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LumenMark-win-x64
          path: dist/
          if-no-files-found: error
