name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Test native path boundaries
        shell: powershell
        run: ./tools/test-host.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LumenMark-win-x64
          path: dist/
          if-no-files-found: error
