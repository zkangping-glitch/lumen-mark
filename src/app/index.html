<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Mark</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="css/app.css?v=__BUILD__">
</head>
<body class="theme-light split">

<div id="app">
  <header class="toolbar">
    <div class="tb-group">
      <button class="tb-btn" id="btnOpen" title="打开文件 (Ctrl+O)" aria-label="打开文件">
        <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      </button>
      <button class="tb-btn" id="btnSave" title="保存 (Ctrl+S)" aria-label="保存">
        <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v6h7V3"/><path d="M7 21v-7h10v7"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="btnSidebar" title="目录 / 最近文件 (Ctrl+Shift+L)" aria-label="切换侧边栏">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <div class="doc-title">
      <span class="name" id="docName">未打开文件</span>
      <span class="dirty-dot" id="dirtyDot"></span>
    </div>

    <div class="tb-group">
      <button class="tb-btn" id="btnSwap" title="交换阅读 / 源码位置 (Ctrl+Shift+X)" aria-label="交换左右视图">
        <svg viewBox="0 0 24 24"><path d="M4 9h15"/><path d="M16 6l3 3-3 3"/><path d="M20 15H5"/><path d="M8 12l-3 3 3 3"/></svg>
      </button>
      <div class="seg" id="modeSeg" role="tablist">
        <button data-mode="reader" title="阅读模式">阅读</button>
        <button data-mode="split" title="分屏编辑">分屏</button>
        <button data-mode="source" title="源码模式">源码</button>
      </div>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="btnTheme" title="切换主题 (Ctrl+Shift+T)" aria-label="切换主题">
        <svg viewBox="0 0 24 24" id="iconTheme"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="side-tabs">
        <button class="side-tab active" data-tab="toc">目录</button>
        <button class="side-tab" data-tab="recent">最近</button>
      </div>
      <div class="side-body" id="sideBody">
        <div id="tocList"></div>
        <div id="recentList" style="display:none"></div>
      </div>
    </aside>

    <section class="pane" id="editorPane">
      <textarea id="editor" spellcheck="false"></textarea>
    </section>

    <div id="splitter" class="splitter" title="拖动调整左右宽度，双击恢复默认 (Ctrl+Shift+X 交换左右)"></div>

    <section class="pane" id="previewPane">
      <div class="preview-scroll" id="previewScroll">
        <article class="markdown-body" id="preview"></article>
      </div>
    </section>

    <div id="welcome">
      <div class="welcome-card">
        <div class="welcome-logo">
          <svg viewBox="0 0 24 24"><path d="M6 3.5h9.5L19 7v13.5H6z"/><path d="M9 11h6M9 14.5h6M9 8h2.5"/></svg>
        </div>
        <h1>Lumen Mark</h1>
        <div class="tagline">轻量 · 本地 · Markdown 阅读与编辑</div>
        <button class="welcome-open" id="welcomeOpen">打开 Markdown 文件</button>
        <div class="welcome-hint">也可以把 .md 文件直接拖进窗口 · Ctrl+O</div>
        <div class="welcome-recents" id="welcomeRecents" style="display:none">
          <div class="wr-title">最近打开</div>
          <div id="welcomeRecentList"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <div class="sb-left">
      <span id="statWords">—</span>
      <span id="statTime"></span>
    </div>
    <div class="sb-path" id="statPath"></div>
  </footer>
</div>

<div id="toast"></div>

<script src="vendor/codemirror/codemirror.js"></script>
<script src="vendor/codemirror/xml.js"></script>
<script src="vendor/codemirror/javascript.js"></script>
<script src="vendor/codemirror/css.js"></script>
<script src="vendor/codemirror/htmlmixed.js"></script>
<script src="vendor/codemirror/markdown.js"></script>
<script src="vendor/codemirror/continuelist.js"></script>
<script src="vendor/codemirror/active-line.js"></script>
<script src="vendor/codemirror/closebrackets.js"></script>
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/hljs/highlight.min.js"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
